name: build Gmeek

on:
  issues:
    types: [opened, edited, labeled, unlabeled, closed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pygithub requests

      - name: Run Gmeek
        run: |
          # 克隆 Gmeek 仓库到临时目录
          git clone --depth 1 https://github.com/Meekdai/Gmeek.git /tmp/gmeek_repo
          # 复制 gmeek.py 到当前目录
          cp /tmp/gmeek_repo/gmeek.py .
          # 执行 Gmeek
          python gmeek.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "build: auto generate blog"
          git push
